<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>403 — Access Denied</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-base);">
  <div style="text-align:center;">
    <div style="font-size:80px;font-weight:800;color:var(--accent-red);line-height:1;">403</div>
    <div style="font-size:20px;font-weight:700;color:var(--text-primary);margin:12px 0 8px;">Access Denied</div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:24px;">You don't have permission to access this resource.</div>
    <a href="/" class="btn btn-primary"><i class="bi bi-arrow-left"></i> Go to Dashboard</a>
  </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</body>
</html>
