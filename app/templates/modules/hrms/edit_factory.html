{% extends 'base.html' %}
{% block title %}Edit Factory{% endblock %}
{% block page_title %}Edit Factory: {{ factory.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin:0 auto;">
  <div class="card-header"><h4 class="card-title">Factory Details</h4></div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('hrms.edit_factory', factory_id=factory.id) }}">
      
      <div class="form-group">
        <label>Factory Name *</label>
        <input type="text" name="name" value="{{ factory.name }}" required>
      </div>
      
      <div class="form-group">
        <label>Complete Address</label>
        <textarea name="address">{{ factory.address or '' }}</textarea>
      </div>

      <div class="form-row-3">
        <div class="form-group">
          <label>Latitude (GPS)</label>
          <input type="number" step="any" name="latitude" id="latitude" value="{{ factory.latitude or '' }}">
        </div>
        <div class="form-group">
          <label>Longitude (GPS)</label>
          <input type="number" step="any" name="longitude" id="longitude" value="{{ factory.longitude or '' }}">
        </div>
        <div class="form-group">
          <label>Attendance Radius (meters)</label>
          <input type="number" name="attendance_radius" value="{{ factory.attendance_radius }}" required>
        </div>
      </div>

      <div style="margin-bottom:20px;">
        <button type="button" class="btn btn-ghost btn-sm" onclick="getLocation()"><i class="bi bi-geo-alt-fill"></i> Get Current Location</button>
        <span id="geoStatus" class="td-muted fs-sm" style="margin-left:10px;"></span>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; border-top:1px solid var(--border); padding-top:20px;">
        <a href="{{ url_for('hrms.factories') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function getLocation() {
  const status = document.getElementById('geoStatus');
  if (!navigator.geolocation) {
    status.innerText = 'Geolocation is not supported by your browser';
    return;
  }
  status.innerText = 'Locating...';
  navigator.geolocation.getCurrentPosition((position) => {
    document.getElementById('latitude').value = position.coords.latitude;
    document.getElementById('longitude').value = position.coords.longitude;
    status.innerText = 'Coordinates captured!';
    setTimeout(() => { status.innerText = ''; }, 3000);
  }, () => {
    status.innerText = 'Unable to retrieve location. Please check browser permissions.';
  });
}
</script>
{% endblock %}
