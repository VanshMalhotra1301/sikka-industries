databases: []

services:
  - type: web
    name: sikka-erp
    runtime: python
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "chmod +x start.sh && ./start.sh"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.9"
